[project]
name = "sgod"
version = "0.1.0"
description = "SGOD: Scene-Graph Oracle Decoding for VLM Hallucination Mitigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "open-clip-torch",
    "transformers",
    "accelerate",
    "Pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-json-report", "ruff"]
train = ["peft"]  # LoRA for SGOD++
eval = ["lmms-eval"]

# Tell setuptools to install only the `sgod` package — without this, the
# flat repo layout (sgod/, data/, configs/, test_imgs/, experiments/) trips
# the multi-top-level-package guard during editable installs.
[tool.setuptools.packages.find]
include = ["sgod*"]
exclude = ["tests*", "data*", "configs*", "test_imgs*", "experiments*", "scripts*", "outputs*", "docs*"]
